services:
  # 1. Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: poliklinik-app:latest
    container_name: poliklinik-app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - app_public:/var/www/public
      - storage_data:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - poliklinik-network

  # 2. Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: poliklinik-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/public:ro
      - storage_data:/var/www/storage:ro
    depends_on:
      - app
    networks:
      - poliklinik-network

  # 3. Database (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: poliklinik-db
    restart: unless-stopped
    command: --innodb-buffer-pool-size=64M --max-connections=60
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-poliklinik_db}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - poliklinik-network

  # 4. Laravel Reverb (WebSockets)
  reverb:
    image: poliklinik-app:latest
    container_name: poliklinik-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/var/www/.env
    depends_on:
      - app
      - db
    networks:
      - poliklinik-network

  # 5. Laravel Queue Worker
  queue:
    image: poliklinik-app:latest
    container_name: poliklinik-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
      - storage_data:/var/www/storage
    depends_on:
      - app
      - db
    networks:
      - poliklinik-network

  # 6. phpMyAdmin (Opsional - akses via http://IP-VPS:8081)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: poliklinik-pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - poliklinik-network

networks:
  poliklinik-network:
    driver: bridge

volumes:
  app_public:
  storage_data:
  db_data:
