[PHP]
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = 300
date.timezone = Asia/Jakarta
expose_php = Off

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1

; CVE-2026-109618 / CVE-2026-109619 hardening (PHP 8.4.27)
; Keep request sizes inside the memory_limit so the OOM path is unreachable.
memory_limit = 256M
post_max_size = 16M
upload_max_filesize = 16M
max_input_vars = 500

; CVE-2026-109618 / CVE-2026-109619 - close the trigger itself.
;
; session.upload_progress lets the multipart callback open and update a
; session while PHP is still parsing the request body, i.e. BEFORE the
; normal module activation. That is the entry point both CVEs need:
; the first one aborts there with a half-initialised request heap, the
; second one leaves the serialize/unserialize globals pointing into
; memory that has been freed.
;
; Nothing in this application uses session upload progress, so turning
; it off removes the trigger without changing any behaviour.
session.upload_progress.enabled = Off

; Reject session ids that were not issued by the server. Without this an
; attacker can choose the session id, which is what the exploit chains
; use to address a session they built themselves.
session.use_strict_mode = 1
