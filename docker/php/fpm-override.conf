[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
